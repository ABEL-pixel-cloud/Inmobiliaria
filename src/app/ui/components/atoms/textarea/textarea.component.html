<div class="form-textarea">
  <textarea
    [id]="id"
    class="form-textarea__input"
    [placeholder]="placeholder"
    [formControl]="control"
    [class.form-textarea__input--primary]="variant === 'primary'"
    [ngClass]="[ customClass]"
    maxlength="90"
  ></textarea>
  <p class="form-textarea__count">{{ count }}/90</p>
</div>
