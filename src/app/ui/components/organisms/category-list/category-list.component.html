<div class="categories">
<app-table
  [data]="categories"
  [columns]="[
    { field: 'name', header: 'Nombre' },
    { field: 'description', header: 'Descripción' }
  ]"
  [currentPage]="currentPage"
  [pageSize]="pageSize">
</app-table>
<div class="categories__pagination">
    <app-pagination 
   [pagination]="paginationData"
   (pageChanged)="goToPage($event)">> 
  </app-pagination>
</div>
</div>
